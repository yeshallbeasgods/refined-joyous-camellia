plugins {
    id 'java'
    id 'io.qameta.allure' version '4.2.0'
}

group = 'com.portfolio'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

ext {
    playwrightVersion = '1.62.0'
    junitVersion = '5.14.4'
    allureVersion = '2.35.5'       // adapter library (writes allure-results)
    allureReportVersion = '2.46.1' // allure-commandline (renders the HTML report) - versions separately from the adapter above
    restAssuredVersion = '6.0.1'
    assertjVersion = '3.27.7'
    jacksonVersion = '2.22.3'
    dotenvVersion = '3.2.0'
}

dependencies {
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'

    testImplementation "com.microsoft.playwright:playwright:${playwrightVersion}"
    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testImplementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    testImplementation "io.github.cdimascio:dotenv-java:${dotenvVersion}"

}

allure {
    version = allureReportVersion
    adapter {
        allureJavaVersion = allureVersion
        frameworks {
            junit5
        }
    }
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}
